services:
  postgres:
    container_name: diet-repeater-pg
    image: public.ecr.aws/docker/library/postgres:17.1-alpine
    restart: unless-stopped
    environment:
      - POSTGRES_PASSWORD=develop
      - POSTGRES_DB=diet-repeater
      - POSTGRES_USER=diet-repeater
    networks:
      - service_network
    volumes:
      - postgres_data:/var/lib/postgresql/data
    ports:
      - 5477:5432
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -d data_hub -U postgres"]
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  postgres_data:

networks:
  service_network:
    driver: bridge